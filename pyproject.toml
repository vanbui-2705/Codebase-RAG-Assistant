[project]
name = "oncall-codebase-rag"
version = "0.1.0"
description = "Agentic RAG Assistant for On-call Incident RCA and Codebase Q&A"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "VinAI On-call RAG Team" }
]
dependencies = [
    # Code Parsing & AST
    "tree-sitter>=0.21.0",
    "py-tree-sitter>=0.21.0",
    
    # Embeddings & Vector DB
    "FlagEmbedding>=1.2.0",
    "qdrant-client>=1.8.0",
    "torch>=2.1.0",
    
    # LLM & Agentic Workflow
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.0.30",
    "google-generativeai>=0.4.0",
    
    # Web API & UI
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "chainlit>=1.0.0",
    
    # Configuration & Utilities
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "ragas>=0.1.0",
    "langfuse>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
