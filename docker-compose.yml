version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: oncall_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # HTTP API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"    # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO

volumes:
  qdrant_storage:
    driver: local
